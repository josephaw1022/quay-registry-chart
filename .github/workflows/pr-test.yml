name: Lint and Test Chart

on:
  pull_request:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/pr-test.yml"
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "renovate/**"

jobs:
  test:
    name: Helm Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.3

      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest

      - name: Lint Chart
        run: |
          helm lint charts/quay-registry

      - name: Run Helm Unit Tests
        run: |
          helm unittest charts/quay-registry

      - name: Test Chart Template Rendering (Schema Validation)
        run: |
          helm template test-quay charts/quay-registry --debug > /dev/null
